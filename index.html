<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUN TOUR 2026</title>
<meta name="theme-color" content="#1a1917">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PUN TOUR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: black tour bar with Pan's smiley + spray texture, day sidebar | info column | schedule column; phone stacks.
   Single monochrome theme taken from Pan's album art: paper white, spray black, no colour accent. */
:root{
  --paper:#f2f0eb; --panel:#f8f7f3; --card:#ffffff; --line:#e4e0d8; --ink:#22201d; --muted:#7a756d; --grey:#ebe8e1; --r:16px; --shadow:0 1px 2px rgba(34,32,29,.05),0 4px 14px rgba(34,32,29,.05);
  --brown:#0d0d0d; --brown-2:#0d0d0d; --brown-soft:#e2ded6;
  --font-display:"Anuphan","Bricolage Grotesque",system-ui,sans-serif;
  --font-body:"Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
a{color:var(--ink);text-decoration-thickness:1.5px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #8a857c;outline-offset:2px}
.mono{font-family:var(--font-body);font-weight:500;font-variant-numeric:tabular-nums}

.tourbar{position:relative;overflow:hidden;background:#1a1917;color:#fff;padding:16px 20px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tourbar::before{content:"";position:absolute;inset:0;background:url(scrib.jpg) center/cover;opacity:.18;pointer-events:none}
.tourbar>*{position:relative}
.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.tourbar h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.02em;line-height:1}
.tourbar .kick{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-bottom:4px}
.tourbar .meta{font-size:12px;opacity:.75;margin-top:4px}
.drip{position:absolute;right:-20px;top:-26px;width:300px;opacity:.55;mix-blend-mode:screen;pointer-events:none;z-index:0}
.tourbar .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;z-index:2;flex-wrap:wrap;justify-content:flex-end;background:rgba(26,25,23,.88);border-radius:999px;padding:5px 6px 5px 12px;max-width:100%}
.tourbar .who select{max-width:180px}
#editToggle{font-weight:600;background:#fff;color:#1a1917;border-color:#fff}
.drip{z-index:0}
.tourbar select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px}
.tabs{display:flex;gap:6px;padding:6px 14px 10px;background:#1a1917;overflow-x:auto}
.tab{background:rgba(255,255,255,.08);color:#e9e6df;border:0;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab .n{font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px}
.tab[aria-selected="true"] .n{background:var(--grey)}

.shell{display:grid;grid-template-columns:240px 1fr;gap:0}
.side{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px;overflow-y:auto;max-height:calc(100vh - 130px);position:sticky;top:0}
.dayitem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;margin-bottom:2px;cursor:pointer}
.dayitem:hover{background:var(--card)}
.dayitem[aria-current="true"]{background:var(--ink);color:#fff}
.dayitem[aria-current="true"] .s{color:#cfcac0}
.dayitem .d{font-weight:600}
.dayitem .s{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayitem.past{opacity:.5}
.pill{font-size:11px;font-weight:500;padding:1px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.show{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.travel{background:transparent;color:var(--ink)}
.pill.both{background:var(--grey);color:var(--ink);border-color:var(--grey)}
.pill.off,.pill.wait{background:transparent;color:var(--muted);border-style:dashed}
.dayitem[aria-current="true"] .pill.show{background:#fff;color:var(--ink);border-color:#fff}
.dayitem[aria-current="true"] .pill.travel,.dayitem[aria-current="true"] .pill.both{color:#fff;background:transparent;border-color:#fff}
main{padding:20px 22px 48px;min-width:0}

.dtitle{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line);text-wrap:balance;line-height:1.2}
.dtitle .t{font-family:var(--font-body);font-weight:500;font-size:15px;color:var(--muted);vertical-align:middle}
.cols{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:18px;align-items:start}
.stack{display:grid;gap:12px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-weight:600;font-size:13px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--grey)}
.btn.dark{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.box{border:1px solid var(--line);background:var(--card);padding:14px;position:relative;border-radius:var(--r);box-shadow:var(--shadow)}
.box.show{background:var(--ink);color:#fff;border-color:var(--ink)}
.box.show .sub,.box.show a{color:#d9d5cc}
.box.travel{background:var(--card)}
.box.hotel{background:var(--grey);border-color:var(--grey);box-shadow:none}
.box h3{margin:0 0 6px;font-size:12px;color:inherit;opacity:.6;font-weight:500}
.box .big{font-weight:600;font-size:15px}
.box .sub{font-size:12px;color:var(--muted)}
.leg{background:var(--panel);padding:9px 11px;margin-top:6px;border-radius:12px}
.leg b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:12px;cursor:default;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px}
.chip.me{background:var(--ink);color:#fff}
.waiting{font-weight:500;color:var(--muted);font-style:italic}
.sched{border:1px solid var(--line);background:var(--card);padding:14px 16px;border-radius:20px;box-shadow:var(--shadow)}
.sched .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sched .hd b{font-family:var(--font-display);font-weight:600;font-size:17px}
.sched .hd span{font-size:12px;color:var(--muted)}
.notice{font-size:12px;padding:8px 12px;margin:6px 0;background:var(--panel);border-radius:12px;color:var(--muted)}
.period{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.mo{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);background:var(--card);padding:11px 14px;margin-bottom:7px;border-radius:14px}
.mo .tm{font-family:var(--font-body);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.mo .tm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.mo .ti{font-weight:600}
.mo .lc{font-size:12px;color:var(--muted)}
.mo .ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mo .ppl span{font-size:11px;background:rgba(127,120,110,.12);border-radius:999px;padding:1px 8px}
.mo .ppl span.me{background:var(--ink);color:#fff;opacity:1}
.mo .tag{font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;background:rgba(127,120,110,.12)}
.mo.dim{opacity:.32}
.gap{font-size:12px;color:var(--muted);border-left:2px dotted var(--line);padding:2px 0 2px 10px;margin:2px 0 8px 30px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);background:var(--card)}
/* categories: tone + border style instead of colour */
.c-Show,.c-Soundcheck{background:var(--ink);color:#fff;border-color:var(--ink)}
.c-Show .tag,.c-Soundcheck .tag,.c-Show .ppl span,.c-Soundcheck .ppl span{background:rgba(255,255,255,.14)}
.c-Show .lc,.c-Soundcheck .lc,.c-Show .tm small,.c-Soundcheck .tm small{color:#cfcac0}
.c-Show .ppl span.me,.c-Soundcheck .ppl span.me{background:#fff;color:var(--ink)}
.c-Flight,.c-Airport{border-color:#bdb7ad}
.c-Van{border-style:dashed;border-color:#bdb7ad}
.c-Hotel{background:var(--grey);border-color:var(--grey)}
.c-Lobby{box-shadow:inset 4px 0 0 var(--ink)}
.c-Meal,.c-Press,.c-Other{background:var(--panel)}

.list{display:grid;gap:8px;max-width:820px}
.lrow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.lrow:hover{background:var(--grey)}
.lrow .sub{font-size:12px;color:var(--muted)}
.lrow .big{font-weight:600}
.shell.noside{grid-template-columns:1fr}
.calwrap{display:grid;gap:18px;max-width:1180px;margin:0 auto}
@media(min-width:960px){.calwrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.callist{margin-top:0!important;position:sticky;top:12px}}
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
.calhead h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;white-space:nowrap}
.calhead .sub{font-size:12px;color:var(--muted)}
.calbtns{display:flex;gap:6px}
.calnav{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-width:36px;height:36px;padding:0 12px;font-size:16px;cursor:pointer}
.calnav:hover{background:var(--grey)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calw{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.calw.we{color:#a39d93}
.cd{min-height:70px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;min-width:0;transition:background .15s}
.cd:hover{background:var(--grey)}
.cd.out{visibility:hidden}
.cd.past{opacity:.45}
.cd .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;border-radius:999px;margin:-1px 0 0 -1px}
.cd.today .dn{background:var(--ink);color:#fff}
.cd.has{background:var(--card);border-color:#cfcac1}
.cd .ev{display:block;background:var(--ink);color:#fff;border-radius:7px;padding:2px 5px;font-size:10px;line-height:1.3;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cd .ic{font-size:11px;margin-top:auto;color:var(--muted)}
.calleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 2px 0}
.calleg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.callist{margin-top:4px}
@media(max-width:759px){.cd .ev{font-size:0;height:6px;padding:0;border-radius:3px}.cd.has{background:var(--card)}}
.callist .lrow{grid-template-columns:86px 1fr}
.callist .lrow .pill{display:none}
@media(min-width:760px){.cal{padding:18px}.cd{min-height:104px;padding:7px}.cd .ev{font-size:12px;padding:3px 7px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.calgrid{gap:6px}}
.roster{display:grid;gap:10px}
.rg{display:grid;gap:2px}
.rgh{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:4px 0 2px}
.rrow{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:baseline;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid transparent;text-align:left;width:100%}
button.rrow{cursor:pointer;border-color:var(--line)}
.rrow.me{background:var(--ink);color:#fff}.rrow.me .rr{color:#ddd}
.rn{font-weight:600}.rr{color:var(--muted);font-size:13px}
@media(min-width:760px){.roster.wide{grid-template-columns:repeat(2,1fr)}}
.gear{grid-column:1/-1;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ghead b{font-family:var(--font-display);font-size:17px}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--grey);border-radius:999px;padding:4px}
.gseg button{border:0;background:transparent;border-radius:999px;padding:8px;font-weight:600;cursor:pointer}
.gseg button[aria-selected="true"]{background:var(--ink);color:#fff}
.gseg button span{font-weight:500;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.gbar{height:6px;background:var(--grey);border-radius:999px;margin:10px 0 6px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .2s}
.gcat{border-top:1px solid var(--line)}
.gch{display:grid;grid-template-columns:1fr auto 18px;gap:8px;width:100%;border:0;background:none;padding:11px 2px;font-weight:600;text-align:left;cursor:pointer}
.gcat.full .gch span:first-child{color:var(--muted)}
.gn{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}.gcat.full .gn{color:var(--ink);font-weight:600}
.car{color:var(--muted)}
.gi{display:flex;align-items:flex-start;gap:4px;padding:2px 0 6px}
.gtk{flex:1;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;min-width:0}
.gtk .gbox{width:24px;height:24px;border-radius:8px;border:2px solid #b9b3a8;display:grid;place-items:center;font-weight:700;font-size:14px;background:#fff}
.gi.on .gtk{background:var(--card)}
.gi.on .gbox{background:var(--ink);border-color:var(--ink);color:#fff}
.gi.on .gt b{text-decoration:line-through;text-decoration-color:#9a948a;color:var(--muted)}
.gt{display:grid;gap:2px;min-width:0}.gt small{color:var(--muted);font-size:12px;line-height:1.35}.gt em{font-style:normal;font-size:11px;color:var(--muted)}
.gx{display:inline-block;font-size:10.5px;font-weight:600;background:var(--grey);border-radius:999px;padding:1px 7px;vertical-align:1px;text-decoration:none}
.gadd{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}.gadd .ed{white-space:nowrap}
.gq{font-size:12px;color:var(--muted);white-space:nowrap}
.gi .ed{margin-top:8px}
.gprint{display:none}
@media print{.install,.toast{display:none!important}.gear{box-shadow:none;break-before:page;border:0;padding:0}.gear .ghead .sub{display:none}.gseg,.gbar,.gcat,.gadd,.gear .ed{display:none!important}.gprint{display:block}
.gprint table{width:100%;border-collapse:collapse;font-size:11px}.gprint th,.gprint td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
.gprint th{background:#eee}.gprint tr.pc td{background:#222;color:#fff;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.gprint small{color:#555}.gprint tr{break-inside:avoid}.gprint td:nth-child(n+2){white-space:nowrap;width:1%}}
h2.lh{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.copybox{width:100%;min-height:180px;font:12px/1.5 var(--font-mono);border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card);color:var(--ink)}
.foot{font-size:11px;color:var(--muted);margin-top:24px;letter-spacing:.04em}

@media (max-width:860px){
  .shell{display:block}
  .side{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .dayitem{min-width:150px;margin:0;background:var(--card)}
  .cols{grid-template-columns:1fr}
  main{padding:14px 16px 40px}
  .tourbar h1{font-size:28px}
  .drip{width:200px;top:-18px}
  .tourbar .who{margin-left:0;width:100%}
  .lrow{grid-template-columns:90px 1fr}
  .lrow>:last-child{grid-column:1/-1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{.tabs,.side,.btnrow,.tourbar .who,.drip{display:none!important}.shell{display:block}.cols{grid-template-columns:260px 1fr}body{background:#fff}.mo,.box{break-inside:avoid}}
/* edit mode, modal, install banner */
.hbtn{color:#fff;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtn.on{background:#1a1917;color:#fff;border-color:#fff}
.editbar{display:none;background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;align-items:center;gap:10px;flex-wrap:wrap}
body.editing .editbar{display:flex}
.ed{display:none;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--ink)}
body.editing .ed{display:inline-flex;align-items:center;gap:4px}
body.editing button.chip{cursor:pointer}body.editing button.chip:hover{border-color:var(--ink)}
.ed:hover{border-color:var(--ink)}
.c-Show .ed,.c-Soundcheck .ed,.box.show .ed{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.mo .side-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(20,19,17,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:grid;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel);color:var(--ink);width:100%}
.f input:focus,.f select:focus{outline:2px solid #8a857c;outline-offset:0}
.tok{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tok button{border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:12px;padding:3px 10px;cursor:pointer}
.tok button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:110px}
.btn.danger{color:#a12a2a;border-color:#e8c4c4}
.err{color:#a12a2a;font-size:13px;margin-top:8px;min-height:1em}
.install{display:none;position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px;gap:10px;align-items:center;z-index:15;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.install.show{display:flex}
.install b{display:block;font-size:14px}
.install button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.install .x{background:transparent;color:#fff;padding:4px 8px}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.ptext{width:100%;min-height:240px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);color:var(--ink)}
.ph{font-size:14px;margin:16px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pinl{font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.pinl.block{display:flex;margin-top:10px;font-size:13px;color:var(--ink)}
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:22px 64px 64px minmax(120px,1fr) 104px 110px;gap:6px;align-items:center;background:var(--panel);border-radius:12px;padding:6px 8px}
.prow input,.prow select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--card);color:var(--ink);min-width:0}
.prow .pin-l,.prow .pin-n{grid-column:2/-1;font-size:12px}
.prow:has(.pchk:not(:checked)){opacity:.4}
.pwarn{margin-top:10px;font-size:12px;color:var(--muted)}
#pModal .sheet{max-width:760px}
@media (max-width:640px){.prow{grid-template-columns:22px 60px 60px 1fr}.prow .pin-c,.prow .pin-w{grid-column:2/-1}}
.box.setlist .sl{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.box.setlist .sl:last-child{border-bottom:0}
.sl-n{font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sl-s{font-weight:600}.sl-s small{font-weight:400;color:var(--muted)}
.sl-k{font-size:12px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px}
.sl.seg{grid-template-columns:1fr auto;font-size:12px;color:var(--muted);text-align:center}
.sl.seg span{display:flex;align-items:center;gap:8px}.sl.seg span::before,.sl.seg span::after{content:"";flex:1;border-top:1px dashed var(--line)}
.tourbar{padding-top:max(16px,env(safe-area-inset-top))}
</style>
</head>
<body>
<header class="tourbar">
  <img class="drip" src="drip.jpg" alt="">
  <img class="logo" src="icon-512.png" alt="PUN">
  <div><div class="kick">Tour 2026 · Day Schedule</div><h1 id="tourTitle">PUN</h1><div class="meta" id="tourMeta"></div></div>
  <div class="who"><label for="who">ดูตารางของ</label><select id="who"></select><button class="hbtn" type="button" id="editToggle">✎ แก้ไข</button></div>
</header>
<div class="editbar" id="editbar"><span>โหมดแก้ไข · กดปุ่ม ✎ ที่แต่ละรายการ หรือ + เพื่อเพิ่ม</span><span class="spacer" style="flex:1"></span><button class="hbtn on" type="button" id="pasteBtn">📋 วางข้อความจาก LINE</button><button class="hbtn" type="button" id="reloadBtn">รีเฟรชข้อมูล</button><button class="hbtn" type="button" id="lockBtn">ออกจากโหมดแก้ไข</button></div>
<nav class="tabs" role="tablist" aria-label="มุมมอง">
  <button class="tab" role="tab" data-view="days">Days <span class="n" id="n-days"></span></button>
  <button class="tab" role="tab" data-view="cal">ปฏิทิน</button>
  <button class="tab" role="tab" data-view="flights">Travel <span class="n" id="n-flights"></span></button>
  <button class="tab" role="tab" data-view="hotels">Hotels <span class="n" id="n-hotels"></span></button>
  <button class="tab" role="tab" data-view="venues">Shows <span class="n" id="n-venues"></span></button>
</nav>
<div class="shell">
  <aside class="side" id="side" aria-label="เลือกวัน"></aside>
  <main id="app"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="sheet" id="mForm" novalidate>
    <h2 id="mTitle"></h2>
    <div class="fgrid" id="mFields"></div>
    <div class="err" id="mErr" role="alert"></div>
    <div class="acts">
      <button class="btn dark" type="submit" id="mSave">บันทึก</button>
      <button class="btn" type="button" id="mCancel">ยกเลิก</button>
      <button class="btn danger" type="button" id="mDelete">ลบ</button>
    </div>
  </form>
</div>

<div class="modal" id="pModal" role="dialog" aria-modal="true" aria-label="วางข้อความจาก LINE"><div class="sheet"><h2>วางข้อความจาก LINE</h2><div id="pBody"></div></div></div>

<div class="install" id="install" role="region" aria-label="ติดตั้งแอป">
  <div style="flex:1"><b>ติดตั้ง PUN TOUR ลงมือถือ</b><span id="installText"></span></div>
  <button type="button" id="installBtn">ติดตั้ง</button>
  <button type="button" class="x" id="installX" aria-label="ปิด">✕</button>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script>
/* ===== CONFIG =====
   API: the Apps Script web app URL (ends in /exec). Leave empty to show the built-in snapshot only. */
const CONFIG = { API: (window.PUN_API||"").trim(), SHEET_URL: "https://docs.google.com/spreadsheets/d/1_rbN1QnNus-q8VO694cj5tmxW3bLWBd4SfufwiURBgY/edit" };
const SNAPSHOT = null;
const SNAPSHOT_TIME = "";
const TABS = ["Shows","Schedule","Travel","Hotels","Crew","Links","Setlist","Gear","GearCheck"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

const KEYS = {
  Shows:["id","date","endDate","name","type","venue","city","address","map","setTime","setLen","others","contact","contactPhone","hotelId","status","notes","crew"],
  Schedule:["showId","date","time","end","item","cat","who","loc","notes"],
  Travel:["id","showId","date","type","no","from","to","dep","arr","who","driver","driverPhone","pickup","ref","notes"],
  Hotels:["id","showId","name","address","phone","checkin","checkout","map","rooms","notes"],
  Crew:["name","short","role","group","phone","line","passport","notes"],
  Links:["showId","label","url","notes"],
  Setlist:["showId","seq","no","song","key","ver","notes"],
  Gear:["id","cat","item","detail","qty","showId"],
  GearCheck:["showId","gearId","phase","by","time"]
};
const CATS = ["Lobby","Van","Flight","Airport","Hotel","Show","Soundcheck","Meal","Press","Other"];
const FIELDS = {
  Schedule:[["showId","งาน","show"],["date","วันที่","date"],["time","เวลา","time"],["end","ถึงเวลา","time"],["item","รายการ","text",1],["cat","ประเภท","sel:"+CATS.join(",")],["loc","สถานที่","text"],["who","ใครเกี่ยวข้อง","who",1],["notes","หมายเหตุ","text",1]],
  Travel:[["id","รหัส","auto:T"],["showId","งาน","show"],["date","วันที่","date"],["type","ประเภท","sel:Flight,Van,Car,Bus,Train,Boat"],["no","เลขไฟลต์ / ทะเบียนรถ","text",1],["from","จาก","text"],["to","ไป","text"],["dep","ออก","time"],["arr","ถึง","time"],["who","ใครไปเที่ยวนี้","who",1],["driver","คนขับ","text"],["driverPhone","เบอร์คนขับ","tel"],["pickup","จุดรับ","text",1],["ref","Booking ref","text"],["notes","หมายเหตุ","text"]],
  Hotels:[["id","รหัส","auto:H"],["showId","งาน","show"],["name","ชื่อโรงแรม","text",1],["address","ที่อยู่","text",1],["phone","เบอร์โรงแรม","tel"],["map","ลิงก์แผนที่","url"],["checkin","เช็กอิน","date"],["checkout","เช็กเอาต์","date"],["rooms","ห้อง / ใครพัก","text",1],["notes","หมายเหตุ","text",1]],
  Shows:[["id","รหัส","auto:S"],["status","สถานะ","sel:Confirmed,TBC,Cancelled"],["date","วันที่","date"],["endDate","ถึงวันที่ (ถ้าหลายวัน)","date"],["name","ชื่องาน","text",1],["type","ประเภท","sel:Show,Festival,Pub,Event,Private"],["venue","Venue","text"],["city","เมือง","text"],["address","ที่อยู่","text",1],["map","ลิงก์แผนที่","url",1],["setTime","เวลาขึ้นโชว์","time"],["setLen","ความยาว (นาที)","number"],["others","ศิลปินร่วมเวที","text",1],["contact","ผู้ติดต่อหน้างาน","text"],["contactPhone","เบอร์ผู้ติดต่อ","tel"],["hotelId","Hotel ID","text"],["notes","หมายเหตุ","text",1],["crew","ทีมที่ไปงานนี้ (ไม่เลือก = ทุกคน)","crew",1]]
};
FIELDS.Setlist=[["showId","งาน","show"],["seq","ลำดับในลิสต์","number"],["no","เลขเพลง (ว่าง = ช่วงพูด/คั่น)","text"],["song","ชื่อเพลง / ช่วง","text",1],["key","คีย์","text"],["ver","เวอร์ชัน","text"],["notes","หมายเหตุ","text",1]];
FIELDS.Crew=[["name","ชื่อ (ชื่อจริงหรือชื่อเล่น)","text",1],["short","ชื่อที่โชว์ในเว็บ","text"],["group","กลุ่ม","sel:Band,Crew,Management,Artist"],["role","ตำแหน่ง","text",1],["notes","หมายเหตุ","text",1]];
FIELDS.Gear=[["id","รหัส","auto:G"],["showId","ใช้กับงาน","showall"],["cat","หมวด","sel:Drum,Bass,Guitar,Keyboard,Pun,System,Other"],["item","ชื่อของ","text",1],["detail","รายละเอียด / ของในกล่อง","text",1],["qty","จำนวน","text"]];
const TITLES = {Gear:"ของ",Setlist:"เพลง",Schedule:"คิวเวลา",Travel:"การเดินทาง",Hotels:"โรงแรม",Shows:"งาน",Crew:"คนในทีม"};

let D = null, SOURCE = "", LIVE = false;

/* ===== data ===== */
function fromApi(json){ const raw={}; for(const t of TABS){ raw[t]=(json.tabs&&json.tabs[t])||[] } return raw; }
function build(raw){
  D={};
  for(const t of TABS){
    const rows=raw[t]||[];
    D[t]=rows.slice(1).map(x=>{ const v=Array.isArray(x)?x:x.v; const o={_row:Array.isArray(x)?null:x.r,_old:v.map(c=>String(c??""))}; KEYS[t].forEach((k,i)=>o[k]=String(v[i]??"").trim()); return o })
      .filter(o=>KEYS[t].some(k=>o[k]!==""));
  }
}
function snapshotRaw(){ const raw={}; for(const t of TABS) raw[t]=SNAPSHOT[t]||[[]]; return raw; }
const tstamp=iso=>new Date(iso).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

async function load(){
  if(CONFIG.API && !CONFIG.API.startsWith("__")){
    try{
      const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),12000);
      const res=await fetch(CONFIG.API,{signal:ctl.signal}); clearTimeout(tm);
      const json=await res.json(); if(!json.ok) throw new Error(json.error||"load");
      build(fromApi(json)); LIVE=true; SOURCE="อัปเดต "+tstamp(json.updated);
      store.set("pun-cache",JSON.stringify(json)); return;
    }catch(e){ console.warn("live load failed",e); }
    const cached=store.get("pun-cache");
    if(cached){ try{ const json=JSON.parse(cached); build(fromApi(json)); LIVE=false; SOURCE="ออฟไลน์ · ข้อมูลเมื่อ "+tstamp(json.updated); return; }catch(e){} }
  }
  build(SNAPSHOT?snapshotRaw():{}); LIVE=false; SOURCE="โหลดข้อมูลไม่ได้ ลองเชื่อมเน็ตแล้วรีเฟรช";
}
async function post(payload){
  const res=await fetch(CONFIG.API,{method:"POST",body:JSON.stringify(payload)});
  const json=await res.json(); if(!json.ok) throw new Error(json.error||"บันทึกไม่สำเร็จ");
  return json;
}

/* ===== helpers ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const dt=s=>{const [y,m,d]=(s||"").split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const fShort=s=>okDate(s)?dt(s).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"}):"ไม่ระบุวัน";
const fRange=(a,b)=>dt(a).toLocaleDateString("th-TH",{day:"numeric",month:"short"})+" – "+dt(b).toLocaleDateString("th-TH",{day:"numeric",month:"short"});
const mins=t=>{const m=/^(\d{1,2})[:.](\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+" ชม.":"")+(h&&r?" ":"")+(r?r+" นาที":"")};
const strip=s=>(s||"").replace(/^\(ตัวอย่าง\)\s*/,"");
const CATLAB={Lobby:"นัดรวม",Van:"รถ",Flight:"บิน",Airport:"สนามบิน",Hotel:"โรงแรม",Show:"โชว์",Soundcheck:"ซาวด์เช็ก",Meal:"อาหาร",Press:"Press",Other:"อื่นๆ"};
const TT={Flight:"บิน",Van:"รถตู้",Car:"รถ",Bus:"รถทัวร์",Train:"รถไฟ",Boat:"เรือ"};
const me=()=>$("#who").value;
const person=n=>D.Crew.find(c=>c.name===n||c.short===n);
function matches(field){const sel=me();if(!sel)return true;
  const w=(field||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!w.length||w.includes("ทุกคน")||w.includes("everyone"))return true;
  const p=person(sel);const keys=[sel,p?.short,p?.group,p?.role].filter(Boolean).map(s=>s.toLowerCase());
  return w.some(x=>keys.includes(x))}
function isMeTok(x){const sel=me();if(!sel||x==="ทุกคน")return false;const p=person(sel);return [sel,p?.short,p?.group].filter(Boolean).map(s=>s.toLowerCase()).includes(x.toLowerCase())}
function allDays(){const set=new Set();
  D.Shows.forEach(s=>{if(!okDate(s.date))return;set.add(s.date);if(okDate(s.endDate)){const d=dt(s.date),e=dt(s.endDate);while(d<e){d.setDate(d.getDate()+1);set.add(iso(d))}}});
  D.Schedule.forEach(r=>okDate(r.date)&&set.add(r.date));D.Travel.forEach(r=>okDate(r.date)&&set.add(r.date));return [...set].sort()}
const showsOn=s=>D.Shows.filter(x=>x.date===s||(x.endDate&&x.date<=s&&s<=x.endDate));
const travelOn=s=>D.Travel.filter(r=>r.date===s).sort((a,b)=>(mins(a.dep)??9999)-(mins(b.dep)??9999));
const hotelFor=s=>D.Hotels.find(h=>h.checkin&&h.checkout&&h.checkin<=s&&s<h.checkout);
function dayKind(s){const sh=showsOn(s).length,tr=travelOn(s).length;return sh&&tr?["both","Travel + Show"]:sh?["show","Show"]:tr?["travel","Travel"]:["off","Off"]}
function mapLink(name,map,addr){const q=map||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([name,addr].filter(Boolean).join(" ")));return `<a href="${esc(q)}" target="_blank" rel="noopener">เปิดแผนที่</a>`}
const idx=(t,o)=>D[t].indexOf(o);
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${/maps\.app|goo\.gl\/maps|google\.com\/maps/.test(u)?"แผนที่":"ลิงก์"}</a>`);
const setlistOf=id=>D.Setlist.filter(x=>x.showId===id).sort((a,b)=>(parseFloat(a.seq)||0)-(parseFloat(b.seq)||0));
const nextSeq=id=>String(Math.max(0,...setlistOf(id).map(x=>parseFloat(x.seq)||0))+1).padStart(2,"0");
const realCrew=()=>D.Crew.filter(c=>!/^\(/.test(c.name));
function crewFor(shows){const names=new Set();let any=false;
  shows.forEach(s=>{const l=(s.crew||"").split(",").map(x=>x.trim()).filter(Boolean);if(l.length){any=true;l.forEach(n=>names.add(n))}});
  if(!any)return {list:realCrew(),custom:false};
  const known=realCrew().filter(c=>names.has(c.short)||names.has(c.name));const kn=new Set(known.flatMap(c=>[c.short,c.name]));
  const extra=[...names].filter(n=>!kn.has(n)).map(n=>({name:n,short:n,role:"",group:"",_extra:true}));
  return {list:[...known,...extra],custom:true};}
const GROUP_TH={Artist:"Artist",Band:"Band",Crew:"Tech Crew",Management:"Management / A&R"};
function crewRoster(list){if(!list.length)return '<span class="sub">ยังไม่ได้เลือกคน</span>';
  const order=["Artist","Band","Crew","Management"];const groups={};list.forEach(c=>{const g=c.group||"Other";(groups[g]=groups[g]||[]).push(c)});
  const keys=Object.keys(groups).sort((a,b)=>(order.indexOf(a)+1||9)-(order.indexOf(b)+1||9));
  return keys.map(g=>`<div class="rg"><div class="rgh">${esc(GROUP_TH[g]||g)} · ${groups[g].length}</div>${groups[g].map(c=>{const mine=me()&&c.name===me();const role=c.role?esc(c.role):'<span class="sub">No role yet</span>';
    const inner=`<span class="rn">${esc(c.short||c.name)}</span><span class="rr">${role}</span>`;
    return editing()&&!c._extra?`<button type="button" class="rrow" data-edit="Crew" data-i="${idx("Crew",c)}">${inner}<span class="sub">✎</span></button>`:`<div class="rrow${mine?" me":""}">${inner}</div>`}).join("")}</div>`).join("")}
const edBtn=(t,o,label="✎ แก้")=>`<button class="ed" type="button" data-edit="${t}" data-i="${idx(t,o)}">${label}</button>`;
const addBtn=(t,label,preset)=>`<button class="ed" type="button" data-add="${t}" data-preset="${esc(JSON.stringify(preset||{}))}">${label}</button>`;


/* ===== gear checklist ===== */
let GPHASE="out",GPENDING=0;const GOPEN=new Set();
const GEARCATS=["Drum","Bass","Guitar","Keyboard","Pun","System","Other"];
const gearTicks=(sid,ph)=>{const m=new Map();D.GearCheck.forEach(r=>{if(r.showId===sid&&r.phase===ph)m.set(r.gearId,r)});return m};
function gearBox(shows){
  if(!D.Gear.length&&!editing())return "";
  return shows.filter(x=>x.status!=="Cancelled").map(x=>{
    const list=D.Gear.filter(g=>!g.showId||g.showId===x.id);const ids=new Set(list.map(g=>g.id));
    const cnt=m=>[...m.keys()].filter(k=>ids.has(k)).length;
    const out=gearTicks(x.id,"out"),back=gearTicks(x.id,"back"),cur=GPHASE==="out"?out:back,tot=list.length,nc=cnt(cur);
    const cats=GEARCATS.filter(c=>list.some(g=>(g.cat||"Other")===c)).concat([...new Set(list.map(g=>g.cat||"Other"))].filter(c=>!GEARCATS.includes(c)));
    const done=nc>=tot&&tot>0;const extra=list.filter(g=>g.showId).length;
    let h=`<section class="gear"><div class="ghead"><div><b>Gear Checklist${shows.length>1?" · "+esc(x.name):""}</b><div class="sub">${done?"✓ ครบแล้ว":`เหลืออีก ${tot-nc} ชิ้น`}${extra?` · ของเฉพาะงานนี้ ${extra}`:""}${me()?"":" · เลือกชื่อใน “ดูตารางของ” เพื่อบันทึกว่าใครติ๊ก"}</div></div></div><div class="gadd">${addBtn("Gear","+ ของทุกงาน",{})}${addBtn("Gear","+ เฉพาะงานนี้",{showId:x.id})}</div>
    <div class="gseg" role="tablist"><button type="button" data-gphase="out" aria-selected="${GPHASE==="out"}">ขาไป <span>${cnt(out)}/${tot}</span></button><button type="button" data-gphase="back" aria-selected="${GPHASE==="back"}">ขากลับ <span>${cnt(back)}/${tot}</span></button></div>
    <div class="gbar"><i style="width:${tot?Math.round(nc/tot*100):0}%"></i></div>`;
    cats.forEach(c=>{const items=list.filter(g=>(g.cat||"Other")===c);const n=items.filter(g=>cur.has(g.id)).length;const key=x.id+"|"+c;const open=GOPEN.has(key);
      h+=`<div class="gcat${n===items.length?" full":""}"><button type="button" class="gch" data-gcat="${esc(key)}" aria-expanded="${open}"><span>${esc(c)}</span><span class="gn">${n}/${items.length}${n===items.length?" ✓":""}</span><span class="car">${open?"▴":"▾"}</span></button>`;
      if(open)h+=items.map(g=>{const t=cur.get(g.id);return `<div class="gi${t?" on":""}"><button type="button" class="gtk" data-tick="${esc(x.id)}|${esc(g.id)}" aria-pressed="${!!t}"><span class="gbox">${t?"✓":""}</span><span class="gt"><b>${esc(g.item)}${g.showId?` <span class="gx">เฉพาะงานนี้</span>`:""}</b>${g.detail?`<small>${esc(g.detail)}</small>`:""}${t?`<em>✓ ${esc(t.by||"")} ${esc((t.time||"").slice(11))}</em>`:""}</span><span class="gq">${esc(g.qty)}</span></button>${edBtn("Gear",g,"✎")}</div>`}).join("");
      h+=`</div>`});

  if(type==="showall") return `<div class="${cls}"><label for="${id}">${label}</label><select id="${id}" name="${k}"><option value="">ทุกงาน (ของประจำ)</option>${[...D.Shows].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<option value="${esc(s.id)}"${s.id===val?" selected":""}>เฉพาะ ${fShort(s.date)} · ${esc(s.name)}</option>`).join("")}</select></div>`;
  if(type==="show") return `<div class="${cls}"><label for="${id}">${label}</label><select id="${id}" name="${k}"><option value="">-</option>${[...D.Shows].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<option value="${esc(s.id)}"${s.id===val?" selected":""}>${esc(s.id)} · ${fShort(s.date)} · ${esc(s.name)}</option>`).join("")}</select></div>`;
  if(type.startsWith("sel:")) return `<div class="${cls}"><label for="${id}">${label}</label><select id="${id}" name="${k}">${type.slice(4).split(",").map(o=>`<option value="${o}"${o===val?" selected":""}>${k==="cat"?CATLAB[o]+" ("+o+")":o}</option>`).join("")}</select></div>`;
  if(type==="who"){const sid=$("#f_showId")?.value||FORM_SHOW;const shw=D.Shows.find(s=>s.id===sid);const pool=shw?crewFor([shw]).list:realCrew();const toks=["ทุกคน","Artist","Band","Crew","Management",...pool.map(c=>c.short||c.name)];
    const cur=(val||"").split(",").map(s=>s.trim()).filter(Boolean);
    return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${k}" value="${esc(val)}" placeholder="ทุกคน" autocomplete="off"><div class="tok" data-for="${id}">${[...new Set(toks)].map(t=>`<button type="button" class="${cur.includes(t)?"on":""}" data-tok="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`}
  if(type==="crew"){const cur=(val||"").split(",").map(s=>s.trim()).filter(Boolean);
    return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${k}" value="${esc(val)}" placeholder="ทุกคน" autocomplete="off"><div class="tok" data-for="${id}" data-mode="crew">${realCrew().map(c=>{const t=c.short||c.name;return `<button type="button" class="${cur.includes(t)?"on":""}" data-tok="${esc(t)}" title="${esc(c.role)}">${esc(t)} <span style="opacity:.6">· ${esc(c.role)}</span></button>`}).join("")}</div></div>`}
  if(type.startsWith("auto:")) return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${k}" value="${esc(val)}" readonly></div>`;
  const it={date:"date",time:"time",tel:"tel",url:"url",number:"number",pin:"password"}[type]||"text";
  const extra=type==="pin"?' inputmode="numeric" autocomplete="off"':type==="time"?' step="300"':"";
  return `<div class="${cls}"><label for="${id}">${label}</label><input id="${id}" name="${k}" type="${it}" value="${esc(val)}"${extra}></div>`;
}

function applyServer(json){build(fromApi(json));store.set("pun-cache",JSON.stringify(json));SOURCE="อัปเดต "+tstamp(json.updated);render();toast("บันทึกลง Sheet แล้ว")}
function validate(tab,v){
  if(tab==="Schedule"){if(!okDate(v.date))throw new Error("ใส่วันที่ก่อน");if(!v.item)throw new Error("ใส่ชื่อรายการก่อน")}
  if(tab==="Shows"){if(!okDate(v.date))throw new Error("ใส่วันที่ก่อน");if(!v.name)throw new Error("ใส่ชื่องานก่อน")}
  if(tab==="Travel"&&!okDate(v.date))throw new Error("ใส่วันที่ก่อน");
  if(tab==="Hotels"){if(!v.name)throw new Error("ใส่ชื่อโรงแรมก่อน");if(!okDate(v.checkin)||!okDate(v.checkout))throw new Error("ใส่วันเช็กอินและเช็กเอาต์")}
  if(tab==="Schedule"&&!v.who)v.who="ทุกคน";
  if(tab==="Crew"){if(!v.name)throw new Error("ใส่ชื่อก่อน");if(!v.short)v.short=v.name}
}
function editRecord(tab,o,only){
  const fl=only?FIELDS[tab].filter(f=>only.includes(f[0])):FIELDS[tab];
  openForm({title:only?"เลือกทีมที่ไป "+o.name:"แก้"+TITLES[tab],fields:fl,values:o,
    onSave:async v=>{const full={};KEYS[tab].forEach(k=>full[k]=k in v?v[k]:o[k]);validate(tab,full);const vals=KEYS[tab].map(k=>full[k]);applyServer(await post({pin:store.get("pun-pin"),action:"update",tab,row:o._row,old:o._old,values:vals}))},
    onDelete:only?null:async()=>{applyServer(await post({pin:store.get("pun-pin"),action:"delete",tab,row:o._row,old:o._old}))}});
}
function addRecord(tab,preset){
  const values={...preset};
  FIELDS[tab].forEach(([k,,type])=>{if(type.startsWith("auto:"))values[k]=nextId(tab,type.slice(5)); if(type.startsWith("sel:")&&!values[k])values[k]=type.slice(4).split(",")[0]});
  if(tab==="Schedule"&&!values.who)values.who="ทุกคน";
  if(tab==="Hotels"&&values.checkin&&!values.checkout){const d=dt(values.checkin);d.setDate(d.getDate()+1);values.checkout=iso(d)}

    onSave:async v=>{validate(tab,v);const vals=KEYS[tab].map(k=>v[k]??"");const json=await post({pin:store.get("pun-pin"),action:"add",tab,values:vals});if(tab==="Shows"&&okDate(v.date)){VIEW="days";DAY=v.date;history.replaceState(null,"","#d-"+v.date)}applyServer(json)}});

/* ===== LINE message parser ===== */
const TH_MONTHS={"มกราคม":1,"ม.ค.":1,"มค":1,"กุมภาพันธ์":2,"ก.พ.":2,"กพ":2,"มีนาคม":3,"มี.ค.":3,"มีค":3,"เมษายน":4,"เม.ย.":4,"เมย":4,"พฤษภาคม":5,"พ.ค.":5,"พค":5,"มิถุนายน":6,"มิ.ย.":6,"มิย":6,"กรกฎาคม":7,"ก.ค.":7,"กค":7,"สิงหาคม":8,"ส.ค.":8,"สค":8,"กันยายน":9,"ก.ย.":9,"กย":9,"ตุลาคม":10,"ต.ค.":10,"ตค":10,"พฤศจิกายน":11,"พ.ย.":11,"พย":11,"ธันวาคม":12,"ธ.ค.":12,"ธค":12,
  "jan":1,"feb":2,"mar":3,"apr":4,"may":5,"jun":6,"jul":7,"aug":8,"sep":9,"oct":10,"nov":11,"dec":12};
function parseDateText(s,fallbackYear){
  s=(s||"").trim(); let m;
  if((m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return ymd(+m[1],+m[2],+m[3]);
  if((m=/(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*[\/.-]\s*(\d{2,4})/.exec(s))){let y=+m[3];if(y<100)y+=2000;return ymd(y,+m[2],+m[1])}
  const low=s.toLowerCase();
  for(const [name,mo] of Object.entries(TH_MONTHS).sort((a,b)=>b[0].length-a[0].length)){
    const i=low.indexOf(name.toLowerCase()); if(i<0) continue;
    const before=low.slice(0,i).match(/(\d{1,2})\D*$/); const after=low.slice(i+name.length).match(/^\D*(\d{4})/);
    if(!before) continue; return ymd(after?+after[1]:fallbackYear,mo,+before[1]);
  }
  return "";
  function ymd(y,mo,d){if(y>2400)y-=543;const p=n=>String(n).padStart(2,"0");return `${y}-${p(mo)}-${p(d)}`}
}
const T=s=>{const m=/(\d{1,2})\s*[.:：]\s*(\d{2})/.exec(s||"");return m?String(+m[1]).padStart(2,"0")+":"+m[2]:""};
const RANGE=/(\d{1,2})\s*[.:：]\s*(\d{2})\s*(?:น\.?)?\s*(?:-|–|—|ถึง|to)\s*(\d{1,2})\s*[.:：]\s*(\d{2})/i;
const ONE=/(\d{1,2})\s*[.:：]\s*(\d{2})/;
const URL_RE=/https?:\/\/\S+/;
const PHONE=/(0\d[\d\s-]{7,11}\d)/;
function clean(line){return line.replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{27BF}\u{2900}-\u{297F}\u{2B00}-\u{2BFF}\u{3030}\u{303D}\u{FE0F}\u{200D}]/gu,"").replace(/^[\s⁃•·\-–—*]+/,"").replace(/━+/g,"").trim()}
function guessCat(label,section){
  const s=(label+" "+(section||"")).toLowerCase();
  if(/sound\s*check|soundcheck|ซาวด์|เช็คเสียง|เช็กเสียง|line\s*check/.test(s))return "Soundcheck";
  if(/รถ|van|รับ.*จุด|จุดที่|เดินทาง/.test(s))return "Van";
  if(/flight|บิน|ไฟลต์|สนามบิน/.test(s))return /สนามบิน|check.?in/.test(s)?"Airport":"Flight";
  if(/ข้าว|อาหาร|meal|lunch|dinner|catering/.test(s))return "Meal";
  if(/press|สัมภาษณ์|interview|meet|greet/.test(s))return "Press";
  if(/lobby|นัด|ถึงหน้างาน|call time|calltime/.test(s))return "Lobby";
  if(/โรงแรม|hotel|check.?out|เช็กเอาต์/.test(s))return "Hotel";
  if(/load|set\s*up|setup|โหลด|ติดตั้ง|show|โชว์|แสดง|rehearsal|ซ้อม|stand\s*by|standby|เวที/.test(s))return "Show";
  return "Other";
}
function guessWho(label,cat,crewNames){
  const found=crewNames.filter(n=>n&&label.includes(n));
  if(found.length)return found.join(", ");
  if(/load|set\s*up|setup|โหลด|ติดตั้ง/i.test(label))return "Crew";
  return "ทุกคน";
}
function parseLine(text,opts={}){
  const year=opts.year||new Date().getFullYear(); const crewNames=opts.crewNames||[];
  const out={show:{},items:[],van:[],warnings:[],date:""};
  const raw=String(text||"").split(/\r?\n/);
  let section="", lastItem=null, songs=[], inShow=false, pickup=null;
  const pushItem=(it)=>{out.items.push(it);lastItem=it;return it};
  for(let i=0;i<raw.length;i++){
    const orig=raw[i]; const line=clean(orig); if(!line) continue;
    const url=(orig.match(URL_RE)||[])[0];
    const kv=/^([^:：]{0,40}?[^\d\s:：])\s*[:：]\s*(.*)$/.exec(line);
    const key=kv?kv[1].trim().toLowerCase():""; const val=kv?kv[2].trim():"";
    // URL-only line: attach to last thing
    if(url&&line.replace(URL_RE,"").trim()===""){
      if(pickup){pickup.map=url}else if(lastItem&&!lastItem._mapped){lastItem.notes=[lastItem.notes,"แผนที่ "+url].filter(Boolean).join(" · ");lastItem._mapped=1}
      else if(!out.show.map)out.show.map=url;
      continue;
    }
    // headers
    if(/^(งาน|ชื่องาน|event)$/.test(key)){out.show.name=val;continue}
    if(/^(ศิลปิน|artist)$/.test(key)){continue}
    if(/^(วันที่แสดง|วันที่|วันแสดง|date|วันงาน)$/.test(key)){const d=parseDateText(val,year);if(d&&!out.date)out.date=d;continue}
    if(/^(สถานที่|venue|location|ที่อยู่)$/.test(key)){if(val)out.show.venue=val;if(url)out.show.map=url;section="";continue}
    if(/^เวที$/.test(key)){section="เวที";inShow=false;pickup=null;continue}
    if(/^(show|โชว์)$/i.test(line)){section="SHOW";inShow=true;pickup=null;continue}
    if(/^นัดหมายรถ|^รถตู้|^การเดินทาง/.test(line)&&!RANGE.test(line)&&!ONE.test(line)){section="รถตู้";inShow=false;continue}
    // pickup point header: "จุดที่ 1 รับภู + เครื่องดนตรี"
    const pm=/^จุดที่\s*(\d+)\s*(.*)$/.exec(line);
    if(pm){pickup={no:pm[1],label:pm[2].trim(),time:"",addr:"",phone:"",map:""};out.van.push(pickup);section="รถตู้";continue}
    if(pickup){
      if(/^เวลา/.test(line)&&ONE.test(line)){pickup.time=T(line);continue}
      if(/เบอร์|โทร|tel/i.test(line)){const ph=(line.match(PHONE)||[])[0];pickup.phone=line.replace(/^(เบอร์ติดต่อ|เบอร์|โทร)\s*[:：]?\s*/,"").trim();continue}
      if(!pickup.addr&&!/หมายเหตุ/.test(line)){pickup.addr=line.replace(URL_RE,"").trim();if(url)pickup.map=url;continue}
    }
    // note / arrival deadline
    if(/หมายเหตุ|note/i.test(line)){
      const t=T(line); const note=line.replace(/^หมายเหตุ\s*[:：]?\s*/,"").trim();
      if(t&&/ถึง|ไม่เกิน|ภายใน/.test(line)){pushItem({time:t,end:"",item:"ถึงหน้างาน (ไม่เกิน "+t+")",cat:"Lobby",who:"ทุกคน",loc:out.show.venue||"",notes:""});}
      out.show.notes=[out.show.notes,note].filter(Boolean).join(" · ");pickup=null;continue}
    // SHOW block date/time
    if(inShow&&/^(วันที่|date)/.test(key)){const d=parseDateText(val,year);if(d&&!out.date)out.date=d;continue}
    const rg=RANGE.exec(line);
    if(rg){
      const a=String(+rg[1]).padStart(2,"0")+":"+rg[2], b=String(+rg[3]).padStart(2,"0")+":"+rg[4];
      let label=kv&&!/^(เวลา|time)$/.test(key)?kv[1].trim():"";
      const prefix=line.slice(0,line.indexOf(rg[0])).replace(/[:：\-–]\s*$/,"").replace(/^(เวลา|time)\s*[:：]?\s*/i,"").trim();
      const rest=line.slice(line.indexOf(rg[0])+rg[0].length).replace(/^\s*(น\.?)?\s*/,"").trim();
      if(!label) label=prefix||"";
      if(!label) label=rest||(inShow?"โชว์":section||"รายการ");
      const extra=label===rest?"":rest;
      const cat=inShow&&!/load|set|sound/i.test(label)?"Show":guessCat(label,section);
      const it=pushItem({time:a,end:b,item:label,cat,who:guessWho(label,cat,crewNames),loc:section==="เวที"||inShow?"เวที":"",notes:extra});
      if(cat==="Show"&&(inShow||/โชว์|show|แสดง/i.test(label))&&!/load|set|โหลด|ติดตั้ง/i.test(label)&&!out.show.setTime){out.show.setTime=a;const mm=(mins(b)-mins(a));if(mm>0)out.show.setLen=String(mm)}
      continue;
    }
    if(inShow&&!kv&&!ONE.test(line)){songs.push(line);continue}
    // "(สามารถ...)" helper notes
    if(/^\(.*\)$/.test(line)&&lastItem){lastItem.notes=[lastItem.notes,line.replace(/^\(|\)$/g,"")].filter(Boolean).join(" · ");continue}
    // single time "Label : 14:00"
    if(kv&&ONE.test(val)&&!/^(เวลา|time)$/.test(key)){const t=T(val);const cat=guessCat(kv[1],section);pushItem({time:t,end:"",item:kv[1].trim()+(val.replace(ONE,"").replace(/^\s*น\.?/,"").trim()?" "+val.replace(ONE,"").replace(/^\s*น\.?/,"").trim():""),cat,who:guessWho(kv[1],cat,crewNames),loc:"",notes:""});continue}
    if(!kv&&ONE.test(line)&&line.length<80){const t=T(line);const label=line.replace(ONE,"").replace(/^\s*(น\.?)?\s*[-–:]?\s*/,"").trim()||"รายการ";const cat=guessCat(label,section);pushItem({time:t,end:"",item:label,cat,who:guessWho(label,cat,crewNames),loc:"",notes:""});continue}
    out.warnings.push(line);
  }
  // van pickups -> schedule items
  out.van.forEach(p=>{
    const who=guessWho(p.label,"Van",crewNames);
    out.items.push({time:p.time,end:"",item:`รถตู้${p.label?" "+p.label:""} (จุดที่ ${p.no})`,cat:"Van",who,loc:p.addr||p.label.replace(/^รับ\s*/,""),notes:[p.phone?"ติดต่อ "+p.phone:"",p.map?"แผนที่ "+p.map:""].filter(Boolean).join(" · ")});
  });
  if(songs.length){out.show.notes=["เพลง: "+songs.join(" / "),out.show.notes].filter(Boolean).join(" · ")}
  out.items.forEach(it=>{delete it._mapped;it.item=it.item.replace(/\s{2,}/g," ").trim()});
  out.items.sort((x,y)=>(mins(x.time)??9999)-(mins(y.time)??9999));
  return out;
  function mins(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null}
}

function showsOnDate(d){return D.Shows.filter(s=>s.date===d||(s.endDate&&s.date<=d&&d<=s.endDate))}
function renderImportPreview(){
  const r=IMP.r; const date=r.date||DAY||todayISO();
  const cands=showsOnDate(date);
  const sel=cands[0]?.id||"__new";
  const opts=[...D.Shows].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<option value="${esc(s.id)}"${s.id===sel?" selected":""}>${esc(s.id)} · ${fShort(s.date)} · ${esc(s.name)}</option>`).join("");
  const showFields=[["name","ชื่องาน"],["venue","Venue / สถานที่"],["map","ลิงก์แผนที่"],["setTime","เวลาขึ้นโชว์"],["setLen","ความยาว (นาที)"],["notes","หมายเหตุงาน"]];
  const itemRows=r.items.map((it,i)=>`<div class="prow" data-i="${i}">
      <input type="checkbox" class="pchk" checked aria-label="ใช้รายการนี้">
      <input class="pin-t" value="${esc(it.time)}" aria-label="เวลา" placeholder="--:--">
      <input class="pin-e" value="${esc(it.end)}" aria-label="ถึงเวลา" placeholder="ถึง">
      <input class="pin-i" value="${esc(it.item)}" aria-label="รายการ">
      <select class="pin-c" aria-label="ประเภท">${CATS.map(c=>`<option value="${c}"${c===it.cat?" selected":""}>${CATLAB[c]}</option>`).join("")}</select>
      <input class="pin-w" value="${esc(it.who)}" aria-label="ใคร">
      <input class="pin-l" value="${esc(it.loc)}" aria-label="สถานที่" placeholder="สถานที่">
      <input class="pin-n" value="${esc(it.notes)}" aria-label="หมายเหตุ" placeholder="หมายเหตุ">
    </div>`).join("");
  $("#pBody").innerHTML=`
    <div class="fgrid">
      <div class="f"><label for="pDate">วันที่</label><input id="pDate" type="date" value="${esc(date)}"></div>
      <div class="f"><label for="pShow">ใส่ลงงาน</label><select id="pShow"><option value="__new"${sel==="__new"?" selected":""}>+ สร้างงานใหม่</option>${opts}</select></div>
    </div>
    <h3 class="ph">ข้อมูลงาน <label class="pinl"><input type="checkbox" id="pShowUpd" checked> อัปเดตช่องที่อ่านได้</label></h3>
    <div class="fgrid">${showFields.map(([k,l])=>`<div class="f${k==="notes"||k==="map"||k==="name"?" full":""}"><label for="ps_${k}">${l}</label><input id="ps_${k}" value="${esc(r.show[k]||"")}" placeholder="(ไม่เปลี่ยน)"></div>`).join("")}</div>
    <h3 class="ph">คิวเวลา ${r.items.length} รายการ <span class="sub">ติ๊กออกถ้าไม่เอา · แก้ข้อความได้</span></h3>
    <div class="plist">${itemRows||'<div class="sub">ไม่พบคิวเวลา</div>'}</div>
    <div id="pExisting"></div>
    ${r.van.length?`<label class="pinl block"><input type="checkbox" id="pTravel" checked> เพิ่มในกล่อง Travel ด้วย (รถตู้ ${r.van.length} จุดรับ)</label>`:""}
    ${r.warnings.length?`<details class="pwarn"><summary>บรรทัดที่อ่านไม่ออก ${r.warnings.length} บรรทัด (ไม่ได้บันทึก)</summary>${r.warnings.map(w=>`<div>${esc(w)}</div>`).join("")}</details>`:""}
    <div class="err" id="pErr"></div>
    <div class="acts"><button class="btn dark" type="button" id="pSave">บันทึกลง Sheet</button><button class="btn" type="button" id="pBack">กลับไปแก้ข้อความ</button><button class="btn" type="button" data-pclose>ยกเลิก</button></div>`;
  const refreshExisting=()=>{const d=$("#pDate").value,sid=$("#pShow").value;const ex=D.Schedule.filter(x=>x.date===d&&(sid==="__new"||x.showId===sid));
    const sample=ex.some(x=>/^\(ตัวอย่าง\)/.test(x.item));
    $("#pExisting").innerHTML=ex.length?`<label class="pinl block"><input type="checkbox" id="pReplace"${sample?" checked":""}> ลบคิวเดิมของวันนี้ก่อน (${ex.length} คิว${sample?" · เป็นตัวอย่าง":""})</label>`:""};
  $("#pDate").onchange=()=>{const c=showsOnDate($("#pDate").value);$("#pShow").value=c[0]?.id||"__new";refreshExisting()};
  $("#pShow").onchange=refreshExisting; refreshExisting();
  $("#pBack").onclick=()=>{const t=IMP.text;openImport();$("#pText").value=t};
  $("#pSave").onclick=saveImport;
}
async function saveImport(){
  const btn=$("#pSave"); btn.disabled=true; $("#pErr").textContent="";
  try{
    const d=$("#pDate").value; if(!okDate(d)) throw new Error("ใส่วันที่ก่อน");
    let sid=$("#pShow").value; const ops=[];
    const sv={};["name","venue","map","setTime","setLen","notes"].forEach(k=>sv[k]=$("#ps_"+k).value.trim());
    if(sid==="__new"){
      sid=nextId("Shows","S"); const o={id:sid,date:d,status:"Confirmed",type:"Event",...sv}; if(!o.name)o.name=o.venue||"งานใหม่";
      ops.push({action:"add",tab:"Shows",values:KEYS.Shows.map(k=>o[k]||"")});
    }else if($("#pShowUpd").checked){
      const s=D.Shows.find(x=>x.id===sid); const full={...s};
      Object.entries(sv).forEach(([k,v])=>{if(v)full[k]=v});
      if(sv.venue&&!full.city)full.city="";
      ops.push({action:"update",tab:"Shows",row:s._row,old:s._old,values:KEYS.Shows.map(k=>full[k]??"")});
    }
    if($("#pReplace")?.checked){D.Schedule.filter(x=>x.date===d&&x.showId===sid).forEach(x=>ops.push({action:"delete",tab:"Schedule",row:x._row,old:x._old}))}
    document.querySelectorAll("#pBody .prow").forEach(row=>{
      if(!row.querySelector(".pchk").checked)return;
      const g=c=>row.querySelector(c).value.trim();
      const it={showId:sid,date:d,time:g(".pin-t"),end:g(".pin-e"),item:g(".pin-i"),cat:g(".pin-c"),who:g(".pin-w")||"ทุกคน",loc:g(".pin-l"),notes:g(".pin-n")};
      if(!it.item)return; ops.push({action:"add",tab:"Schedule",values:KEYS.Schedule.map(k=>it[k]||"")});
    });
    if($("#pTravel")?.checked){const v=IMP.r.van;const first=v[0];const arr=(IMP.r.items.find(x=>x.cat==="Lobby"&&/ถึงหน้างาน/.test(x.item))||{}).time||"";
      const tr={id:nextId("Travel","T"),showId:sid,date:d,type:"Van",no:"รถตู้",from:v.map(p=>p.addr||p.label).join(" / "),to:sv.venue||"",dep:first.time,arr,who:"",pickup:v.map(p=>`จุด ${p.no} ${p.addr||p.label} (${p.time})`).join(" · "),notes:v.map(p=>p.phone).filter(Boolean).join(" · ")};
      ops.push({action:"add",tab:"Travel",values:KEYS.Travel.map(k=>tr[k]||"")})}
    if(!ops.length) throw new Error("ไม่มีรายการให้บันทึก");
    const json=await post({pin:store.get("pun-pin"),action:"batch",ops});
    closeImport(); VIEW="days"; DAY=d; history.replaceState(null,"","#d-"+d); applyServer(json);
  }catch(e){$("#pErr").textContent=e.message||"บันทึกไม่สำเร็จ";if(/PIN/.test(e.message||"")){store.del("pun-pin");exitEdit()}}
  finally{btn.disabled=false}
}
document.addEventListener("click",e=>{if(e.target.closest("[data-pclose]")){closeImport()}else if(e.target.id==="pModal"){closeImport()}});

/* ===== install (PWA) ===== */
let deferred=null;
const standalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function maybeInstallBanner(){
  if(standalone()||store.get("pun-install-x"))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){$("#installText").textContent=" กดปุ่มแชร์ (สี่เหลี่ยมลูกศรขึ้น) ใน Safari แล้วเลือก \"เพิ่มไปยังหน้าจอโฮม\"";$("#installBtn").style.display="none";$("#install").classList.add("show")}
  else if(deferred){$("#installText").textContent=" มีไอคอนบนหน้าจอ เปิดเต็มจอ และดูได้ตอนไม่มีเน็ต";$("#install").classList.add("show")}
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;maybeInstallBanner()});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#install").classList.remove("show")};
$("#installX").onclick=()=>{store.set("pun-install-x","1");$("#install").classList.remove("show")};
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}

/* ===== render + events ===== */
function render(){
  readHash();const days=allDays();
  if(VIEW==="days"&&!DAY){const t=todayISO();DAY=days.find(d=>d>=t)||days[days.length-1]||t}
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===VIEW));
  $("#side").style.display=VIEW==="days"?"":"none";$("#side").parentElement.classList.toggle("noside",VIEW!=="days");
  if(VIEW==="days"){renderSide();renderDay(DAY)}else if(VIEW==="cal")renderCal();else if(VIEW==="flights")renderFlights();else if(VIEW==="hotels")renderHotels();else renderVenues();
  $("#tourMeta").textContent=`${days.length?fRange(days[0],days[days.length-1]):""} · ${D.Shows.length} งาน · ${SOURCE}`;
  $("#n-days").textContent=days.length;$("#n-flights").textContent=D.Travel.length;$("#n-hotels").textContent=D.Hotels.length;$("#n-venues").textContent=D.Shows.length;
}
document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-crewpick]");if(cp){e.stopPropagation();editRecord("Shows",D.Shows[+cp.dataset.crewpick],["crew"]);return}
  const ed=e.target.closest("[data-edit]");if(ed){e.stopPropagation();editRecord(ed.dataset.edit,D[ed.dataset.edit][+ed.dataset.i]);return}
  const ad=e.target.closest("[data-add]");if(ad){e.stopPropagation();addRecord(ad.dataset.add,JSON.parse(ad.dataset.preset||"{}"));return}
  const tk=e.target.closest("[data-tick]");if(tk){const [a,b]=tk.dataset.tick.split("|");tickGear(a,b);return}
  const gp=e.target.closest("[data-gphase]");if(gp){GPHASE=gp.dataset.gphase;refreshGear();return}
  const gc=e.target.closest("[data-gcat]");if(gc){const k=gc.dataset.gcat;GOPEN.has(k)?GOPEN.delete(k):GOPEN.add(k);refreshGear();return}
  const cn=e.target.closest("[data-calnav]");if(cn){const [y,m]=CALM.split("-").map(Number);const k=+cn.dataset.calnav;CALM=k?iso(new Date(y,m-1+k,1)).slice(0,7):todayISO().slice(0,7);setHash();return}
  const d=e.target.closest("[data-day]");if(d){VIEW="days";DAY=d.dataset.day;setHash();window.scrollTo(0,0);return}
  const tb=e.target.closest(".tab");if(tb){VIEW=tb.dataset.view;setHash()}});
window.addEventListener("hashchange",render);
$("#editToggle").onclick=()=>editing()?exitEdit():enterEdit();
$("#lockBtn").onclick=()=>{exitEdit();toast("ออกจากโหมดแก้ไขแล้ว")};
$("#pasteBtn").onclick=openImport;
$("#reloadBtn").onclick=async()=>{await load();render();toast("โหลดข้อมูลล่าสุดแล้ว")};
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&LIVE&&!FORM){await load();render()}});

(async()=>{await load();
  const sel=$("#who");sel.innerHTML=`<option value="">ทุกคน</option>`+D.Crew.filter(c=>!/^\(ใส่ชื่อ\)/.test(c.name)).map(c=>`<option value="${esc(c.name)}">${esc(c.short||c.name)} · ${esc(c.role)}</option>`).join("");
  const sv=store.get("pun-who");if(sv&&[...sel.options].some(o=>o.value===sv))sel.value=sv;
  sel.onchange=()=>{store.set("pun-who",sel.value);render()};
  render();setTimeout(maybeInstallBanner,1500)})();

</script>
